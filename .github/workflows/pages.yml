name: Deploy to GitHub Pages

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md", "cli/**", "example-plan.json"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the static site
        run: node scripts/build-pwa.mjs --build "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo the first time this runs, so no manual setup step.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
